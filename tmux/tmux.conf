
# =============================================
# 1. Ustawienia wymagane przez Claude Code
# =============================================

# Zezwolenie na przepuszczanie sekwencji ucieczki (OSC) przez tmuxa
set -g allow-passthrough on

# Włączenie integracji ze schowkiem (OSC 52) - pozwala kopiować tekst na iOS
set -g set-clipboard on

# Włączenie obsługi myszki (scrollowanie, zmiana rozmiaru paneli, klikanie)
set -g mouse on

# Zmniejszenie opóźnienia klawisza ESC (krytyczne dla Vima/Neovima)
set -s escape-time 0

# =============================================
# 2. Ustawienia optymalizujące pod Moshi i iOS
# =============================================

# Potężny scrollback, żeby nie stracić historii generowanego kodu
set -g history-limit 100000

# Włączenie zdarzeń focusu (poprawia odświeżanie interfejsu)
set-option -g focus-events on

# =============================================
# 3. ERGONOMIA I PODSTAWY
# =============================================

# Zmiana domyślnego prefixu z Ctrl+b na Ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Indeksowanie okien i paneli od 1 (zamiast 0)
set -g base-index 1
setw -g pane-base-index 1

# Szybki reload konfiguracji pod Ctrl+a -> r
bind r source-file ~/.tmux.conf \; display-message "Konfiguracja tmux przeładowana!"

# =============================================
# 4. KOLORY I KOLORYSTYKA (TrueColor)
# =============================================

set -g default-terminal "xterm-256color"
set -as terminal-overrides ",xterm*:Tc"

# =============================================
# 5. NAWIGACJA I DZIELENIE OKIEN
# =============================================

# Dzielenie paneli w bieżącym katalogu (pionowo: | , poziomo: -)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Przełączanie paneli w stylu Vima (h, j, k, l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Swobodne zmiana rozmiaru paneli z Shiftem + strzałki
bind -r S-Left resize-pane -L 5
bind -r S-Right resize-pane -R 5
bind -r S-Up resize-pane -U 5
bind -r S-Down resize-pane -D 5

# Zablokowanie zawieszania procesu
unbind C-z

# =============================================
# 6. SUBTELNY STATUS BAR (Minimalizm)
# =============================================

set -g status-position bottom
set -g status-style bg=default,fg=colour8
set -g status-left "#[fg=cyan,bold] #S #[fg=colour8]│ "
set -g status-right "#[fg=colour8]%H:%M #[fg=cyan,bold]#H "
set -g status-left-length 30

# Aktywne / nieaktywne okna
setw -g window-status-current-format "#[fg=green,bold]#I:#W*"
setw -g window-status-format "#[fg=colour8]#I:#W"

# =============================================
# 7. Odpięcie skrótów Alt+litera w tmux
# =============================================

unbind -n M-a
unbind -n M-s
unbind -n M-c
unbind -n M-e
unbind -n M-o
unbind -n M-l
unbind -n M-x
unbind -n M-z
unbind -n M-n
